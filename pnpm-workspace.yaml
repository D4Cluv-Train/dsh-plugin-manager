# pnpm build-script policy: esbuild 0.25 ships its platform binary through
# optionalDependencies, so its postinstall is not required — reject it to keep
# installs quiet and reproducible.
allowBuilds:
  esbuild: false
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-invariants@0.1.0-rc.6'
  - '@deepseek-ai/dsh-typert-protocol@0.1.0-rc.6'

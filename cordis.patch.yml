# @d4cluvtrain/dsh-plugin-manager bundle patch: entries inserted into the profile tree.
# `dsh.bundle.patch` in package.json points here. The composed profile applies
# this insert over the empty profile root (after @deepseek-ai/dsh-base, before
# the profile's own cordis.patch.yml).
#
# plugin-manager          — the web-surface plugin: registers the /plugin-manager
#                         route (inject: ['webServer']), so it mounts only
#                         after the WebServer service is available.
# plugin-manager-installed — the installed-plugins Typert remote service, which
#                         the browser modal queries to list user-installed
#                         bundles.
- insert:
    - id: plugin-manager
      name: '@d4cluvtrain/dsh-plugin-manager'
    - id: plugin-manager-installed
      name: '@d4cluvtrain/dsh-plugin-manager/installed-plugins'
